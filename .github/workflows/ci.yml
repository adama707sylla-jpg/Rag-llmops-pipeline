name: CI — RAG LLMOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: \${{ github.repository }}

jobs:
  # ── Job 1 : Unit Tests ──────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        # minio needs a command — use entrypoint override
        volumes:
          - /tmp/minio-data:/data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests (mocked LLM)
        env:
          PYTHONUTF8: "1"
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          OLLAMA_HOST: localhost
          OLLAMA_PORT: "11434"
          LLM_MODEL: phi3:mini
        run: |
          pytest tests/test_rag.py -v --tb=short --ignore=tests/test_ingestion.py

      - name: Run ingestion tests
        env:
          PYTHONUTF8: "1"
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
        run: |
          pytest tests/test_ingestion.py -v --tb=short

  # ── Job 2 : Docker Build ────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rag-llmops-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        run: |
          docker run -d --name rag-test -p 8000:8000 \
            -e QDRANT_HOST=localhost \
            -e OLLAMA_HOST=localhost \
            rag-llmops-api:ci
          sleep 10
          curl -f http://localhost:8000/health || (docker logs rag-test && exit 1)
          docker stop rag-test

  # ── Job 3 : Push to GHCR (main only) ───────────────────
  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/\${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: \${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
